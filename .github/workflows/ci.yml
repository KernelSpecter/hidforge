name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
      # --bench and --selftest are deliberately NOT run in CI: they inject real
      # input and measure timing against a wall clock, neither of which is
      # meaningful on a shared virtual runner.
      - uses: actions/upload-artifact@v4
        with:
          name: hidforge
          path: target/release/hidforge.exe
