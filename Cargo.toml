[package]
name = "hidforge"
version = "0.1.0"
edition = "2024"

[dependencies]
# glow (OpenGL 3.3) instead of the default wgpu backend: much wider driver
# support on old Intel iGPUs, which is the low-end target. Dropping accesskit,
# x11 and wayland keeps the binary Windows-only and lean.
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",                  # SECURITY_ATTRIBUTES, gates CreateWaitableTimerExW
    "Win32_UI_Input",                  # Raw Input: device enumeration + WM_INPUT
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",                  # Shell_NotifyIconW for the tray icon
    "Win32_Graphics_Gdi",              # WNDCLASSW / RegisterClassW are gated on this
    "Win32_System_LibraryLoader",      # GetModuleHandleW for the message window
    "Win32_System_Console",            # AttachConsole so --bench can print
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Media",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The engine loop must not be slow in a debug build either -- an unoptimised
# spin/wait loop measures its own overhead instead of the timer's.
[profile.dev.package."*"]
opt-level = 2
